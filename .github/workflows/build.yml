name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.3.3

      - run: gradle build
        working-directory: lyrics-fabric-1.16.5

      - uses: actions/upload-artifact@v4
        with:
          name: lyrics-fabric-jar
          path: |
            lyrics-fabric-1.16.5/build/libs/*.jar
            !lyrics-fabric-1.16.5/build/libs/*-sources.jar
